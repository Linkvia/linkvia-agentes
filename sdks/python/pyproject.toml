[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkvia"
version = "0.1.0"
description = "Para conectar el bot o agente de un negocio a Linkvia: recibir mensajes, contestar y escribir de a partes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["linkvia", "chatbot", "bot", "agente", "whatsapp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
# Sin dependencias: solo la biblioteca estándar de Python.
dependencies = []

[project.urls]
Homepage = "https://negocios.linkvia.com.ar/#/desarrolladores"
Source = "https://github.com/linkvia/linkvia-agentes"

[tool.setuptools]
packages = ["linkvia"]
